<script>
'use strict';
/* ====================== util ====================== */
const $=(s,r=document)=>r.querySelector(s);
const nfID=new Intl.NumberFormat('id-ID');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const modelKey=name=>norm(String(name||'').replace(/\s+-\s+.*$/,''));
const colLetter=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const colIndex=ref=>{const m=/^[A-Z]+/i.exec(ref)[0].toUpperCase();let n=0;for(const ch of m)n=n*26+ch.charCodeAt(0)-64;return n-1};
function toNum(v){
  if(typeof v==='number')return isFinite(v)?v:NaN;
  if(v==null)return NaN;
  let s=String(v).replace(/rp/ig,'').replace(/\s/g,'');
  if(!s||!/\d/.test(s))return NaN;
  const neg=/^\(.*\)$/.test(s)||s.startsWith('-');
  s=s.replace(/[^\d.,]/g,'');
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>=0&&ld>=0){const dec=Math.max(lc,ld);s=s.slice(0,dec).replace(/[.,]/g,'')+'.'+s.slice(dec+1)}
  else if(lc>=0||ld>=0){const sep=lc>=0?',':'.';const parts=s.split(sep);
    if(parts.length>2||(parts.length===2&&parts[1].length===3))s=parts.join('');else s=parts.join('.')}
  const n=parseFloat(s);return isNaN(n)?NaN:(neg?-n:n);
}
let toastT;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3800)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtTime=ts=>new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

/* ====================== xlsx reader (tanpa library) ====================== */
const TD=new TextDecoder(),TE=new TextEncoder();
async function inflateRaw(u8){
  const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;

  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);

  return{names:files,async get(name){
    const f=files[name];if(!f)return null;
    const nl=dv.getUint16(f.off+26,true),xl=dv.getUint16(f.off+28,true),st=f.off+30+nl+xl;
    const d=u8.subarray(st,st+f.csize);

}
async function readXlsx(file){
  const z=await unzip(await file.arrayBuffer());
  const dom=s=>new DOMParser().parseFromString(s,'application/xml');
  const txt=async n=>{const d=await z.get(n);return d?TD.decode(d):null};
  const wbx=await txt('xl/workbook.xml');if(!wbx)throw new Error('File ini bukan Excel (.xlsx) yang valid.');
  const wb=dom(wbx),rels=dom(await txt('xl/_rels/workbook.xml.rels')||'<r/>');
  const relMap={};for(const r of rels.getElementsByTagNameNS('*','Relationship'))relMap[r.getAttribute('Id')]=r.getAttribute('Target');
  const sheets=[...wb.getElementsByTagNameNS('*','sheet')].map(el=>{
    const rid=el.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||el.getAttribute('r:id');
    let t=relMap[rid]||'';t=t.startsWith('/')?t.slice(1):'xl/'+t;return{name:el.getAttribute('name'),path:t}});
  let ss=[];const sst=await txt('xl/sharedStrings.xml');
  if(sst){for(const si of dom(sst).getElementsByTagNameNS('*','si')){
    let s='';for(const t of si.getElementsByTagNameNS('*','t'))if(t.parentNode.localName!=='rPh')s+=t.textContent;ss.push(s)}}
  return{sheets:sheets.map(s=>s.name),async rows(i){
    const x=await txt(sheets[i].path);if(!x)return[];
    const d=dom(x),out=[];let auto=-1;
    for(const row of d.getElementsByTagNameNS('*','row')){
      const rn=row.getAttribute('r')?parseInt(row.getAttribute('r'))-1:++auto;auto=rn;let cn=-1;
      for(const c of row.getElementsByTagNameNS('*','c')){
        const ref=c.getAttribute('r');const ci=ref?colIndex(ref):++cn;cn=ci;
        const t=c.getAttribute('t');let v=null;
        const ve=[...c.children].find(k=>k.localName==='v');
        if(t==='inlineStr'){v=[...c.getElementsByTagNameNS('*','t')].map(k=>k.textContent).join('')}
        else if(ve){const raw=ve.textContent;
          if(t==='s')v=ss[+raw];else if(t==='b')v=raw==='1';else if(t==='str')v=raw;else if(t==='e')v=null;
          else{const nv=Number(raw);v=raw!==''&&!isNaN(nv)?nv:raw}}
        if(v!==null){(out[rn]=out[rn]||[])[ci]=v}
      }
    }
    return Array.from(out,r=>r?Array.from(r,x=>x===undefined?null:x):[]);
  }};
}
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.map(r=>r.map(c=>c===''?null:c));
}
async function openTable(file){
  if(/\.csv$/i.test(file.name)){const rows=parseCsv(await file.text());return{sheets:['CSV'],rows:async()=>rows}}
  if(/\.xls$/i.test(file.name))throw new Error('Format .xls lama belum didukung. Simpan ulang sebagai .xlsx atau .csv.');
  return readXlsx(file);
}

/* ====================== xlsx writer ====================== */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u8=>{let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipStore(files){
  const parts=[],cd=[];let off=0;
  for(const[name,data]of files){
    const nb=TE.encode(name),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);

}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function buildXlsx(sheets){
  const files=[];const add=(n,s)=>files.push([n,TE.encode(s)]);
  add('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>');
  add('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');

function detectMap(headers,fields){
  const map={},used=new Set();
  const nh=headers.map(norm);
  for(const f of fields){let i=-1;
    for(const a of f.alias){i=nh.findIndex((h,x)=>h===a&&!used.has(x));if(i>=0)break}
    if(i<0)for(const a of f.alias){i=nh.findIndex((h,x)=>!used.has(x)&&!h.startsWith('total')&&h.includes(a));if(i>=0)break}
    map[f.k]=i;if(i>=0)used.add(i)}
  return map;
}
function prepRows(rows){
  let hr=rows.findIndex(r=>r&&r.filter(c=>c!==null&&c!=='').length>=2);if(hr<0)hr=0;
  const width=Math.max(0,...rows.slice(hr,hr+50).map(r=>(r||[]).length));
  const headers=Array.from({length:width},(_,i)=>{const v=rows[hr]&&rows[hr][i];return v!==null&&v!==undefined&&String(v).trim()?String(v).trim():'Kolom '+colLetter(i)});
  return{hr,headers,data:rows.slice(hr+1).filter(r=>r&&r.some(c=>c!==null&&c!==''))};
}

/* ---- analisis data awal ---- */
function analyseAwal(imp){
  const m=imp.map;const items=new Map();let skipped=0,dups=0,badStock=0;
  for(const r of imp.data){
    const sku=text(cell(r,m.sku));if(!sku){skipped++;continue}
    const k=norm(sku);
    const st=toNum(cell(r,m.stock));if(isNaN(st))badStock++;
    const it={k,sku,name:text(cell(r,m.name))||sku,group:text(cell(r,m.group))||'Tanpa group',stock:isNaN(st)?0:st,buy:toNum(cell(r,m.buy))||0,sell:toNum(cell(r,m.sell))||0,bc:text(cell(r,m.bc))};
    if(items.has(k)){dups++;items.get(k).stock+=it.stock}else items.set(k,it);
  }
  const list=[...items.values()];
  const fresh=list.filter(x=>!IDX.has(x.k)),exist=list.filter(x=>IDX.has(x.k));
  return{list,fresh,exist,skipped,dups,badStock,pcs:list.reduce((a,x)=>a+x.stock,0),hpp:list.reduce((a,x)=>a+x.stock*x.buy,0),
    ok:m.sku>=0&&m.name>=0&&m.stock>=0&&list.length>0};
}
function applyAwal(imp){
  const a=analyseAwal(imp);
  const label=imp.mode==='ganti'?'Data awal (ganti semua)':'Tambah produk';
  snapshotPrev(label);
  if(imp.mode==='ganti'){
    S.products=a.list;S.opname={counts:{},scope:'',ts:null};reindex();
    addLog({type:'awal',label,file:imp.file.name,info:`${fmt(a.list.length)} produk · ${fmt(a.pcs)} pcs · ${rp(a.hpp)}`});
    toast(`${fmt(a.list.length)} produk dimuat.`);
  }else{
    for(const it of a.fresh)S.products.push(it);
    let upd=0;
    if(imp.update)for(const it of a.exist){const p=S.products[IDX.get(it.k)];
      if(imp.map.name>=0)p.name=it.name;if(imp.map.group>=0)p.group=it.group;if(imp.map.buy>=0)p.buy=it.buy;if(imp.map.sell>=0)p.sell=it.sell;if(imp.map.bc>=0)p.bc=it.bc;upd++}
    reindex();
    addLog({type:'tambah',label,file:imp.file.name,info:`${fmt(a.fresh.length)} produk baru`+(imp.update?` · ${fmt(upd)} diperbarui`:` · ${fmt(a.exist.length)} sudah ada (dilewati)`)});
    toast(`${fmt(a.fresh.length)} produk baru ditambahkan.`);
  }
  IMP.awal=null;persist();
}

/* ---- analisis penjualan ---- */
function analyseJual(imp){
  const m=imp.map;const agg=new Map();let skipped=0,rows=0;
  const byName=new Map();if(m.name>=0)for(const p of S.products)byName.set(norm(p.name),p.k);
  for(const r of imp.data){
    const q=toNum(cell(r,m.qty));if(isNaN(q)||q===0){skipped++;continue}
    let key=norm(text(cell(r,m.sku)));let label=text(cell(r,m.sku));
    if(!key&&m.name>=0){const nm=norm(text(cell(r,m.name)));label=text(cell(r,m.name));if(nm&&byName.has(nm))key=byName.get(nm);else key=nm}
    if(!key){skipped++;continue}
    rows++;const g=agg.get(key)||{key,label,qty:0,rows:0};g.qty+=q;g.rows++;agg.set(key,g);
  }
  const matched=[],unmatched=[];
  for(const g of agg.values()){const i=IDX.get(g.key);
    if(i===undefined)unmatched.push(g);else{const p=S.products[i];matched.push({p,qty:g.qty,after:p.stock-g.qty,rows:g.rows})}}
  matched.sort((a,b)=>a.after-b.after);
  const minus=matched.filter(x=>x.after<0);
  const dup=S.logs.find(l=>l.type==='penjualan'&&!l.undone&&l.file===imp.file.name&&l.fsize===imp.file.size);
  return{matched,unmatched,minus,skipped,rows,qty:matched.reduce((a,x)=>a+x.qty,0),qtyUn:unmatched.reduce((a,x)=>a+x.qty,0),
    hpp:matched.reduce((a,x)=>a+x.qty*x.p.buy,0),dup,ok:m.sku>=0&&m.qty>=0&&matched.length>0};
}
function applyJual(imp){
  const a=analyseJual(imp);const changes=[];
  for(const x of a.matched){x.p.stock-=x.qty;changes.push({k:x.p.k,d:-x.qty})}
  addLog({type:'penjualan',label:'Penjualan',file:imp.file.name,fsize:imp.file.size,changes,
    info:`${fmt(a.matched.length)} produk · ${fmt(a.qty)} pcs terjual`+(a.unmatched.length?` · ${fmt(a.unmatched.length)} SKU tidak ditemukan`:''),
    unmatched:a.unmatched.slice(0,300).map(u=>({sku:u.label,qty:u.qty}))});
  toast(`Stok dikurangi: ${fmt(a.qty)} pcs dari ${fmt(a.matched.length)} produk.`);
  IMP.jual=null;persist();
}

function opStats(){

function applyOpname(){

function vImport(){

        <label class="radio"><input type="radio" name="mode" value="tambah" data-act-change="mode" ${imp.mode==='tambah'?'checked':''}><span><b>Tambah produk baru saja</b><small>SKU yang belum ada ditambahkan dengan stok dari file. SKU yang sudah ada tidak mengubah stok.</small></span></label>
        ${imp.mode==='tambah'?`<label class="row small" style="padding-left:12px"><input type="checkbox" data-act-change="update" ${imp.update?'checked':''}> Perbarui juga nama, group, dan harga untuk SKU yang sudah ada (stok tetap)</label>`:''}
      </div>`;
      if(!a.ok)body+=`<div class="banner">Pilih kolom SKU, Nama produk, dan Stok yang benar agar bisa dilanjutkan.</div>`;
      else{
        const stats=imp.mode==='ganti'
          ?`<div><span>Produk di file</span><b>${fmt(a.list.length)}</b></div><div><span>Total pcs</span><b>${fmt(a.pcs)}</b></div><div><span>Nilai HPP</span><b>${rp(a.hpp)}</b></div>${S.products.length?`<div><span>Akan menimpa</span><b>${fmt(S.products.length)} produk</b></div>`:''}`
          :`<div><span>Produk baru</span><b class="pos">${fmt(a.fresh.length)}</b></div><div><span>Sudah ada</span><b>${fmt(a.exist.length)}</b></div><div><span>Pcs baru</span><b>${fmt(a.fresh.reduce((s,x)=>s+x.stock,0))}</b></div>`;
        body+=`<div class="stats">${stats}</div>`;
        if(a.skipped||a.dups||a.badStock)body+=`<p class="small muted">${a.skipped?fmt(a.skipped)+' baris tanpa SKU dilewati. ':''}${a.dups?fmt(a.dups)+' SKU kembar di file digabung (stok dijumlahkan). ':''}${a.badStock?fmt(a.badStock)+' baris dengan stok bukan angka dianggap 0.':''}</p>`;

      }
    }
    body+=`</div>`;
  }else{
    body=`<div class="card"><header><div><h2>Impor penjualan</h2><p>Setiap baris file mengurangi stok SKU yang sama. Jumlah negatif (retur) menambah stok.</p></div></header>`;

      if(a.matched.length||a.unmatched.length)body+=`<div class="stats"><div><span>Produk terjual</span><b>${fmt(a.matched.length)}</b></div><div><span>Pcs dikurangi</span><b>${fmt(a.qty)}</b></div><div><span>HPP terjual</span><b>${rp(a.hpp)}</b></div>
        <div><span>SKU tidak ditemukan</span><b class="${a.unmatched.length?'neg':''}">${fmt(a.unmatched.length)}</b></div><div><span>Stok jadi minus</span><b class="${a.minus.length?'neg':''}">${fmt(a.minus.length)}</b></div></div>`;
      if(a.dup)body+=`<div class="banner">File dengan nama dan ukuran sama sudah diimpor pada ${fmtTime(a.dup.ts)}. Impor lagi akan mengurangi stok dua kali.</div>`;
      if(a.unmatched.length)body+=`<details open><summary>SKU tidak ditemukan (${fmt(a.unmatched.length)}) – tidak ikut mengurangi stok</summary>
        <div class="tablebox"><table><thead><tr><th>SKU / nama di file</th><th class="num">Qty</th></tr></thead><tbody>${a.unmatched.slice(0,100).map(u=>`<tr><td>${esc(u.label)}</td><td class="num">${fmt(u.qty)}</td></tr>`).join('')}</tbody></table></div>
        <div class="row" style="margin-top:8px"><button class="btn" data-act="exp-unmatched">Unduh daftar ini (Excel)</button><span class="small muted">Tambahkan sebagai produk baru lewat Import data awal, lalu impor penjualannya lagi.</span></div></details>`;
      if(a.minus.length)body+=`<details><summary>Stok akan minus (${fmt(a.minus.length)})</summary><div class="tablebox"><table><thead><tr><th>SKU</th><th>Produk</th><th class="num">Stok</th><th class="num">Terjual</th><th class="num">Sisa</th></tr></thead><tbody>${a.minus.slice(0,100).map(x=>`<tr><td class="mono">${esc(x.p.sku)}</td><td class="name">${esc(x.p.name)}</td><td class="num">${fmt(x.p.stock)}</td><td class="num">${fmt(x.qty)}</td><td class="num neg">${fmt(x.after)}</td></tr>`).join('')}</tbody></table></div></details>`;
      if(a.matched.length)body+=`<details><summary>Rincian produk terjual (${fmt(Math.min(100,a.matched.length))} pertama)</summary><div class="tablebox"><table><thead><tr><th>SKU</th><th>Produk</th><th class="num">Stok</th><th class="num">Terjual</th><th class="num">Sisa</th></tr></thead><tbody>${a.matched.slice(0,100).map(x=>`<tr><td class="mono">${esc(x.p.sku)}</td><td class="name">${esc(x.p.name)}</td><td class="num">${fmt(x.p.stock)}</td><td class="num">${fmt(x.qty)}</td><td class="num">${fmt(x.after)}</td></tr>`).join('')}</tbody></table></div></details>`;
      if(a.ok){const btn=`<button class="btn primary">${a.dup?'Tetap kurangi stok':'Kurangi stok'}</button>`;
        body+=`<div>${confirmable('jual',btn,`Kurangi stok ${fmt(a.matched.length)} produk sebanyak ${fmt(a.qty)} pcs?`,'apply-jual')}</div>`}
    }
    body+=`</div>`;
  }
  return`<div class="row">${seg}</div>${body}`;
}

async function doRestore(data){

}
async function importOpname(file){
  try{
    const t=await openTable(file);const p=prepRows(await t.rows(0));
    const m=detectMap(p.headers,[{k:'sku',alias:['sku','kode','barcode']},{k:'f',alias:['stok fisik','stock fisik','qty fisik','fisik','hitung','physical','counted','actual']}]);
    if(m.sku<0||m.f<0)return toast('Kolom "sku" dan "stok fisik" tidak ditemukan di file.');
    let ok=0,miss=0;
    for(const r of p.data){const q=toNum(cell(r,m.f));if(isNaN(q))continue;const k=norm(text(cell(r,m.sku)));
      if(IDX.has(k)){S.opname.counts[k]=q;ok++}else miss++}
    S.opname.ts=S.opname.ts||Date.now();persist();render();
    toast(`${fmt(ok)} hasil hitung dimasukkan`+(miss?`, ${fmt(miss)} SKU tidak dikenal dilewati.`:'.'));
  }catch(e){toast(e.message||'File tidak bisa dibaca.')}
}

const lk=(a,k)=>{k=norm(k);const r=a.find(x=>norm(x[0])===k);return r?r[1]:null};

const price=q=>Math.round((q<=1e4?q*3:q<=2e4?q*2.5:q*2)/1000)*2000;
const skuParts=s=>{const m=/-([A-Za-z]+)-/.exec(s),n=/\d+/.exec(s);return{code:m&&m[1],num:n&&n[0]}};

ui.sel=new Set();ui.tb='cincin';ui.dr={cincin:blank(),satuan:blank()};
function genCincin(r){
  const sku=text(r.sku),{code,num}=skuParts(sku),qty=toNum(r.qty),hpp=toNum(r.hpp),sz=text(r.size),br=text(r.brand);
  const jenis=code&&lk(S.map.jenis,code);
  if(!jenis)return{err:`Kode jenis "${code||'?'}" tidak ada di MAP`};
  if(!num)return{err:'Nomor urut tidak ditemukan di SKU'};
  if(!sz)return{err:'Ukuran kosong (isi angka, atau "Flexibel")'};
  if(!br)return{err:'Brand/kategori kosong'};
  const cat='Cincin '+br,pre=lk(S.map.kat,cat);
  if(pre===null)return{err:`Kategori "${cat}" tidak ada di MAP`};
  if(isNaN(qty)||isNaN(hpp))return{err:'Qty dan Hpp harus angka'};
  const vn=isNaN(+sz)?'Flexibel':'S-'+(+sz),base=`Cincin ${jenis} ${num}`,osku=sku+'-'+(vn==='Flexibel'?'ALLSIZE':vn.replace('S-','SIZE'));
  const o={tp:'cincin',name:base+' Offline',cat,vl:'Ukuran',vn,alt:`${base} ${vn} OFF`,sku:osku,pre,buy:hpp,sell:price(hpp),qty};
  return{p:{k:norm(osku),sku:osku,name:o.name+' - '+vn,group:cat,stock:qty,buy:hpp,sell:o.sell,pos:o}};
}
function genSatuan(r){
  const sku=text(r.sku),{code,num}=skuParts(sku),qty=toNum(r.qty),hpp=toNum(r.hpp);
  const jenis=code&&lk(S.map.jenis,code);
  if(!jenis)return{err:`Kode jenis "${code||'?'}" tidak ada di MAP`};
  if(!num)return{err:'Nomor urut tidak ditemukan di SKU'};
  const wc=(sku.split('-')[3]||'').trim(),wn=lk(S.map.warna,wc);
  if(wn===null)return{err:`Kode warna "${wc}" (bagian ke-4 SKU) tidak ada di MAP`};
  const cat=jenis.replace(/klip/ig,'Clip'),pre=lk(S.map.kat,cat);
  if(pre===null)return{err:`Kategori "${cat}" tidak ada di MAP`};
  if(isNaN(qty)||isNaN(hpp))return{err:'Qty dan Hpp harus angka'};
  const j=jenis.replace(/ Biasa/g,''),o={tp:'satuan',name:`${j} ${num} ${proper(wn+' Offline')}`,alt:`${j} ${num} OFF`,cat,sku,pre,buy:hpp,sell:price(hpp),qty};
  return{p:{k:norm(sku),sku,name:o.name,group:cat,stock:qty,buy:hpp,sell:o.sell,pos:o}};
}
function maxBc(cat,pre){let n=parseInt((S.bcLast||{})[norm(cat)],10)||0;for(const p of [...S.products,...S.pending])if(norm(p.group)===norm(cat)&&p.bc&&String(p.bc).startsWith(pre)){const x=parseInt(String(p.bc).slice(-9),10);if(x>n)n=x}return n}
function lastBc(g){
  let best=null,n=-1;
  for(const p of [...S.products,...S.pending])if(norm(p.group)===norm(g)&&p.bc){const x=parseInt(String(p.bc).slice(-9),10);if(x>n){n=x;best=String(p.bc)}}
  const bl=parseInt((S.bcLast||{})[norm(g)],10)||0,pre=lk(S.map.kat,g);
  if(bl>n&&pre!==null)return String(pre)+String(bl).padStart(9,'0');
  return best||'–';
}
function genAll(kind,rows){
  const out=[],ctr={},seen=new Set(),pk=new Set(S.pending.map(p=>p.k));
  rows.forEach((r,i)=>{
    if(!text(r.sku))return;
    const o=kind==='cincin'?genCincin(r):genSatuan(r);o.i=i+1;out.push(o);
    if(!o.p)return;
    o.dup=IDX.has(o.p.k)||pk.has(o.p.k)||seen.has(o.p.k);seen.add(o.p.k);
    if(o.dup)return;
    const pf=String(o.p.pos.pre),ck=norm(o.p.group);if(!(ck in ctr))ctr[ck]=maxBc(o.p.group,String(o.p.pos.pre));
    ctr[ck]++;o.p.bc=o.p.pos.bc=pf+String(ctr[ck]).padStart(9,'0');
  });
  return out;
}

  'pend-del':d=>{S.pending=S.pending.filter(p=>p.in||p.k!==d.k);persist();render()},
  'exp-pos':()=>{
    const L=S.pending.filter(p=>p.pos),C=L.filter(p=>p.pos.tp==='cincin'),T=L.filter(p=>p.pos.tp==='satuan'),sh=[];
    if(C.length)sh.push({name:'CINCIN',widths:[30,16,20,14,34,28,16,10,14,16,12],rows:[['name','category','variant_column_labels','variant_names','alternative_variant_name','sku','barcode','buy_price','pos_sell_price','track_inventory','stock_qty'],...C.map(p=>{const o=p.pos;return[o.name,o.cat,o.vl,o.vn,o.alt,o.sku,o.bc,o.buy,o.sell,1,o.qty]})]});
    if(T.length)sh.push({name:'SATUAN',widths:[34,24,18,28,16,10,14,16,12],rows:[['name','alternative_name','category','sku','barcode','buy_price','pos_sell_price','track_inventory','stock_qty'],...T.map(p=>{const o=p.pos;return[o.name,o.alt,o.cat,o.sku,o.bc,o.buy,o.sell,1,o.qty]})]});
    if(sh.length)saveXlsx(`barang-baru-pos-${stamp()}.xlsx`,sh)}
});

/* ====================== events ====================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset)}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.file){
    const file=t.files[0];t.value='';if(!file)return;
    if(t.dataset.file==='opname')return importOpname(file);
    if(t.dataset.file==='restore'){try{const j=JSON.parse(await file.text());if(!j||!j.state||!Array.isArray(j.state.products))throw 0;
      ui.confirm={id:'restore',arg:{name:file.name,n:j.state.products.length,data:j.state}};render()}catch(x){toast('File backup tidak valid.')}return}
    return pickFile(t.dataset.file,file);
  }
  if(t.dataset.sel!==undefined){t.checked?ui.sel.add(t.dataset.sel):ui.sel.delete(t.dataset.sel);ui.confirm=null;const e=$('#selbar');if(e)e.innerHTML=selBar();return}
  if(t.dataset.selall!==undefined){stokRows().slice(ui.page*100,ui.page*100+100).forEach(p=>t.checked?ui.sel.add(p.k):ui.sel.delete(p.k));ui.confirm=null;render();return}
  if(t.dataset.bl!==undefined){const x=parseInt(String(t.value).replace(/\D/g,'').slice(-9),10);S.bcLast[norm(t.dataset.bl)]=isNaN(x)?0:x;persist();const e=$('#tbprev');if(e)e.innerHTML=prevHtml();return}
  if(t.dataset.per!==undefined){S.periode=t.value;persist();return}
  if(t.dataset.dr!==undefined)return drChange(t);
  if(t.dataset.mapk)return mapChange(t);
  const a=t.dataset.actChange,imp=IMP[ui.imp];
  if(a==='map'){imp.map[t.dataset.f]=+t.value;ui.confirm=null;render()}
  else if(a==='sheet'){imp.sheet=+t.value;imp.rows=await imp.table.rows(imp.sheet);applySheet(imp);ui.confirm=null;render()}
  else if(a==='mode'){imp.mode=t.value;ui.confirm=null;render()}
  else if(a==='update'){imp.update=t.checked;render()}
  else if(t.id==='gf'){ui.gf=t.value;ui.page=0;ui.sel.clear();render()}
  else if(t.id==='opg'){ui.opGroup=t.value;ui.opPage=0;ui.opZero=false;render()}
  else if(t.id==='opzero'){ui.opZero=t.checked;render()}
});
let qT;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'||t.id==='opq'){clearTimeout(qT);qT=setTimeout(()=>{if(t.id==='q'){ui.q=t.value;ui.page=0;ui.sel.clear()}else{ui.opq=t.value;ui.opPage=0}render()},200)}
  else if(t.classList.contains('fisik')){
    const k=t.dataset.k;const i=IDX.get(k),p=S.products[i];
    if(t.value==='')delete S.opname.counts[k];else{const n=Math.max(0,Math.floor(+t.value));S.opname.counts[k]=n}
    S.opname.ts=S.opname.ts||Date.now();
    t.closest('tr').querySelector('.sel').innerHTML=selCell(p,S.opname.counts[k]);
    const st=opStats();$('#st-counted').firstChild.textContent=fmt(st.counted)+' ';$('#st-plus').textContent='+'+fmt(st.plus);$('#st-minus').textContent=fmt(st.minus);$('#st-val').textContent=rp(st.val);
    persist();
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='scan'&&e.key==='Enter'){
    e.preventDefault();const v=e.target.value.trim();if(!v)return;
    const i=IDX.get(norm(v)),q=Math.max(1,Math.floor(+$('#scanqty').value||1));
    if(i===undefined)ui.lastScan={err:v};
    else{const p=S.products[i];S.opname.counts[p.k]=(S.opname.counts[p.k]||0)+q;S.opname.ts=S.opname.ts||Date.now();ui.lastScan={p};persist()}
    render();const s=$('#scan');if(s){s.value='';s.focus()}
  }
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;
  e.preventDefault();z.classList.toggle('over',ev==='dragover');
  if(ev==='drop'&&e.dataTransfer.files[0])pickFile(z.dataset.drop,e.dataTransfer.files[0]);
}));
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist(true)});
window.addEventListener('pagehide',()=>persist(true));
(async()=>{await loadState();await loadPrev();render()})();
</script>

</body></html>
